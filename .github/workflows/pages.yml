name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/demo/**"
      - "GedCore/**"
      - "GedFire/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build GedFire
        run: dotnet build GedFire/GedFire.csproj --nologo --configuration Release
      - name: Generate demo site
        shell: bash
        run: |
          set -euo pipefail
          bin="GedFire/bin/Release/net10.0/GedFire.dll"
          work="$(mktemp -d)"
          cp docs/demo/ash-whitfield.ged "$work/family.ged"
          dotnet "$bin" apply --input "$work/family.ged" \
            --changes docs/demo/proposed-findings.json --items all
          dotnet "$bin" generate --input "$work/family.ged" \
            --output-dir site --template docs/demo/template.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
