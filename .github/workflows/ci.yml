name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Resolve build number
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            build_number="${version##*.}"
          else
            build_number="$GITHUB_RUN_NUMBER"
          fi
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
      - run: dotnet test --nologo -p:BuildNumber="$BUILD_NUMBER"

  # A feature PR that deletes more documentation lines than it adds has, so
  # far, always meant an agent rewrote the docs from a stale snapshot
  # (PR #59 erased the docs for PRs #54-#58 this way). Label a PR
  # `docs-cleanup` when the net deletion is intentional.
  docs-guard:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'docs-cleanup')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse net documentation loss
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          read -r added deleted <<<"$(git diff --numstat "$base"...HEAD -- README.md docs \
            | awk '{a+=$1; d+=$2} END {printf "%d %d", a, d}')"
          echo "Documentation lines added: $added, deleted: $deleted"
          if (( deleted > added )); then
            echo "::error::This PR deletes more documentation lines ($deleted) than it adds ($added)." \
              "Check that README.md and docs/ were not rewritten from a stale snapshot." \
              "If the deletion is intentional, apply the docs-cleanup label and re-run."
            exit 1
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify tag matches project version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          build_number="${tag_version##*.}"
          project_version=$(dotnet msbuild GedFire/GedFire.csproj \
            -getProperty:Version -p:BuildNumber="$build_number" --nologo)
          test "$tag_version" = "$project_version"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$tag_version" >> "$GITHUB_ENV"
      - name: Publish self-contained binaries
        shell: bash
        run: |
          for rid in win-x64 linux-x64 osx-x64 osx-arm64; do
            dotnet publish GedFire/GedFire.csproj \
              --configuration Release \
              --runtime "$rid" \
              --self-contained true \
              -p:BuildNumber="$BUILD_NUMBER" \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              --output "artifacts/GedFire-$rid"
            (cd artifacts && zip -r "../GedFire-$rid.zip" "GedFire-$rid")
          done
      - name: Pack .NET tool
        run: dotnet pack GedFire/GedFire.csproj --configuration Release -p:BuildNumber="$BUILD_NUMBER" --output artifacts
      - name: Log in to NuGet
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: morrillonline
      - name: Publish .NET tool to NuGet
        run: dotnet nuget push "artifacts/GedFire.$PACKAGE_VERSION.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" GedFire-*.zip artifacts/GedFire.*.nupkg --generate-notes